<body>
    <div class="middle-container">
        <div class="content content-no-menu">
            <div class="main_content main_content-no-menu2">
                <h3>計算所需退休儲備金</h3>
                <h5>基本原則</h5>
                <p>退休需要:&nbsp; 旨在維持優質的退休生活模式、總退休儲備金將會計算你在預期退休年期內的預計退休開支，並扣除強積金的累績金額。</p>

                <p><strong>所需退休儲備金</strong><br>
                = 當客戶退休日計，以現在值計 [預計退休開支 x 預期退休年期]</p>

                <p><strong>強積金</strong><br>
                = 總強積金金額，以未來值計 [強積金每月供款額 (僱主及僱員) x 12 個月] ÷&nbsp; 年期 (預計退休年齡 - 現在年齡)</p>

                <p><strong>差額</strong><br>
                =所需退休儲備金 – 強積金</p>

                <p><strong>每月所需儲蓄額</strong><br>
                = 客戶根據每月所需儲蓄額 ，再按指定投資回報率不斷增值，從而累積所需退休儲備金</p>
            </div>
        </div>
    </div>
