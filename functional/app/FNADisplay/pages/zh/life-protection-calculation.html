                <h3>計算所需人壽保障</h3>
                <h5>基本原則：</h5>
                <p>人壽保障需要 = 承擔年期內的總家庭財務開支責任的現在值及即時現金需要。因應早逝而引發之需要應付家庭供養人士現時生活水平需要的總開支</p>

                <p><strong>保障需要計算程式：</strong><br>
                = 現在值[每月總開支 (每月租金支出及其它每月開支) X 12 X 承擔年期] + 即時資金需要 (按揭 / 教育基金/ 善終開支/ 其它)</p>

                <p><strong>流動資產</strong><br>
                = 客戶擁有的現金/存款、定期存款 / 股票/ 基金/ 債券 及其它</p>

                <p><strong>現時人壽保障</strong><br>
                = 客戶擁有的人壽保險總保障額</p>

                <p><strong>保障差距</strong><br>
                = 保障需要 -流動資產 -現時人壽保障</p>
            </div>
        </div>
    </div>
