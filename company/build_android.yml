uwp:
  productid: 'ed8b4870-1f80-0136-1a33-1866da1b0e67'
  target: 'ARM'

android:
  #manifest_template: 'AndroidManifest.erb'
  version: 9
  minSDK: 14
  targetSDK: 28
  ## Note: in order to simplify debugging only app messages and system channels with priority informative and higher, and any errors are enabled by default
  logcatFilter: APP:I StrictMode:I DEBUG:I *:E
  fcmSenderID: "621032458649"
  fcmAppID: "1:621032458649:android:098083ab81d510dc"
  # orientation: landscape
  # orientation: portrait
  windowSoftInputMode: "adjustPan"
  # useproguard: true
  # proguardrules: 'proguard-user-rules.pro'
  capabilities:
    - hardware_acceleration
  production:
    certificate: c2lbiz-release.keystore
    password: "C2lbiz@1234"
    alias: "c2lbiz" 
  no_compression: [pdf,MP4,mp4,pptx,html]

wm:
  #sdk: "MC3000c50b (ARMV4I)"
  #sdk: "Windows Mobile 6.5.3 Professional DTK (ARMV4I)"
  extensions:
    - webkit

win32:
  deployqt: 1
  deploymsvc: 1

extensions: ['json', 'rholang', 'zlib', 'openssl.so', 'openssl', 'digest', 'digest-sha1', 'digest-sha2', 'digest-md5', 'fileutils', 'rhoxml', 'bigdecimal', 'fcm-push', 'fingerprint', 'documentpicker', 'pdfgen']

rhobundle:
  exclude_items:
  - thumb.db